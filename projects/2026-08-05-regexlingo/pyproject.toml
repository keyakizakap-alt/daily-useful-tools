[project]
name = "regexlingo"
version = "0.1.0"
description = "Explain a regex in plain English, test it, and check it for catastrophic-backtracking risk."
requires-python = ">=3.9"
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
