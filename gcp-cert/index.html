<!doctype html>
<html lang="ja" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>くもみち — Google Cloud 認定 全冠ナビ</title>
<meta name="description" content="Google Cloud の現行認定資格15種の出題範囲・試験情報・最新の変更点をまとめ、ドメイン別演習・模擬試験・間隔反復・学習計画で全冠取得を支援する非公式の学習アプリです。">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   design tokens
   ============================================================ */
:root {
  --font-sans: "Inter", "Zen Kaku Gothic New", -apple-system, BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif;
  --bg:            #f3f5f9;
  --bg-grad:       radial-gradient(1100px 600px at 12% -14%, #dde8fb 0%, rgba(221,232,251,0) 60%),
                   radial-gradient(900px 520px at 96% 0%, #ece3fb 0%, rgba(236,227,251,0) 55%);
  --surface:       #ffffff;
  --surface-2:     #f7f9fc;
  --surface-sunk:  #edf1f7;
  --border:        #dde3ec;
  --border-strong: #c5cfdc;
  --text:          #151c28;
  --text-2:        #475467;
  --text-3:        #7c8798;
  --accent:        #1a5fd0;
  --accent-soft:   #e6eefc;
  --accent-text:   #1a4fa8;
  --ok:            #1e8e3e;
  --ok-soft:       #e3f4e8;
  --ng:            #c5221f;
  --ng-soft:       #fbe7e6;
  --warn:          #b06000;
  --warn-soft:     #fdf0dc;
  --shadow-sm:     0 1px 2px rgba(20,32,52,.06), 0 2px 6px rgba(20,32,52,.05);
  --shadow-md:     0 2px 6px rgba(20,32,52,.07), 0 12px 28px rgba(20,32,52,.09);
  --radius:        16px;
  --radius-sm:     10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:            #0b0f17;
    --bg-grad:       radial-gradient(1100px 600px at 12% -14%, #15223a 0%, rgba(21,34,58,0) 60%),
                     radial-gradient(900px 520px at 96% 0%, #1f1733 0%, rgba(31,23,51,0) 55%);
    --surface:       #131a25;
    --surface-2:     #18202d;
    --surface-sunk:  #0f151f;
    --border:        #252f3e;
    --border-strong: #354255;
    --text:          #e7ecf4;
    --text-2:        #a8b4c6;
    --text-3:        #778499;
    --accent:        #74a8ff;
    --accent-soft:   #182842;
    --accent-text:   #a3c4ff;
    --ok:            #5cc97d;
    --ok-soft:       #14291c;
    --ng:            #f28b82;
    --ng-soft:       #331716;
    --warn:          #f0b35a;
    --warn-soft:     #2f2412;
    --shadow-sm:     0 1px 2px rgba(0,0,0,.4);
    --shadow-md:     0 2px 8px rgba(0,0,0,.45), 0 16px 32px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"] {
  --bg:            #0b0f17;
  --bg-grad:       radial-gradient(1100px 600px at 12% -14%, #15223a 0%, rgba(21,34,58,0) 60%),
                   radial-gradient(900px 520px at 96% 0%, #1f1733 0%, rgba(31,23,51,0) 55%);
  --surface:       #131a25;
  --surface-2:     #18202d;
  --surface-sunk:  #0f151f;
  --border:        #252f3e;
  --border-strong: #354255;
  --text:          #e7ecf4;
  --text-2:        #a8b4c6;
  --text-3:        #778499;
  --accent:        #74a8ff;
  --accent-soft:   #182842;
  --accent-text:   #a3c4ff;
  --ok:            #5cc97d;
  --ok-soft:       #14291c;
  --ng:            #f28b82;
  --ng-soft:       #331716;
  --warn:          #f0b35a;
  --warn-soft:     #2f2412;
  --shadow-sm:     0 1px 2px rgba(0,0,0,.4);
  --shadow-md:     0 2px 8px rgba(0,0,0,.45), 0 16px 32px rgba(0,0,0,.35);
}

/* ============================================================
   base
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh;
  font-family: var(--font-sans); font-size: 15px; line-height: 1.7;
  color: var(--text); background: var(--bg); background-image: var(--bg-grad); background-attachment: fixed;
  font-feature-settings: "palt" 1;
}
a { color: var(--accent-text); text-underline-offset: 2px; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px; }
@media (max-width: 560px) { .wrap { padding: 0 16px; } }
.tnum { font-variant-numeric: tabular-nums; }

/* ============================================================
   header
   ============================================================ */
.top {
  position: sticky; top: 0; z-index: 20;
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px);
  border-bottom: 1px solid var(--border);
}
.top .wrap { display: flex; align-items: center; gap: 16px; height: 60px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); flex-shrink: 0; }
.brand-mark { width: 30px; height: 30px; }
.brand b { font-size: 17px; letter-spacing: .02em; }
.brand small { display: block; font-size: 11px; color: var(--text-3); line-height: 1.2; font-weight: 500; }
.nav { display: flex; gap: 2px; margin-left: auto; overflow-x: auto; scrollbar-width: none; }
.nav::-webkit-scrollbar { display: none; }
.nav a {
  padding: 7px 12px; border-radius: 999px; text-decoration: none; color: var(--text-2);
  font-size: 13.5px; font-weight: 500; white-space: nowrap;
}
.nav a:hover { background: var(--surface-sunk); color: var(--text); }
.nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent-text); }
.icon-btn {
  width: 36px; height: 36px; display: grid; place-items: center; flex-shrink: 0;
  border: 1px solid var(--border); background: var(--surface); border-radius: 10px;
}
.icon-btn svg { width: 18px; height: 18px; }
@media (max-width: 720px) {
  .brand small { display: none; }
  .top .wrap { height: auto; flex-wrap: wrap; padding-top: 10px; padding-bottom: 8px; row-gap: 6px; }
  .nav { order: 3; width: 100%; margin-left: 0; }
  .icon-btn { margin-left: auto; }
}

/* ============================================================
   layout pieces
   ============================================================ */
main { padding: 28px 0 64px; }
.page-head { margin: 4px 0 22px; }
.page-head h1 { font-size: clamp(22px, 3.2vw, 30px); line-height: 1.3; margin: 0 0 6px; letter-spacing: .01em; }
.page-head p { margin: 0; color: var(--text-2); }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .08em; color: var(--accent-text); text-transform: uppercase; margin-bottom: 6px; }
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
}
.pad { padding: 20px 22px; }
@media (max-width: 560px) { .pad { padding: 16px; } }
.section-title { font-size: 17px; margin: 34px 0 12px; display: flex; align-items: baseline; gap: 10px; }
.section-title small { color: var(--text-3); font-weight: 500; font-size: 12.5px; }
.grid { display: grid; gap: 14px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 9px 16px; border-radius: 10px; border: 1px solid var(--border-strong);
  background: var(--surface); font-weight: 600; font-size: 14px; text-decoration: none; color: var(--text);
  transition: background .15s, border-color .15s, transform .05s;
}
.btn:hover { background: var(--surface-sunk); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
:root[data-theme="dark"] .btn.primary { color: #0b1220; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { color: #0b1220; } }
.btn.primary:hover { filter: brightness(1.06); background: var(--accent); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--text-2); }
.btn.ghost:hover { background: var(--surface-sunk); }
.btn.sm { padding: 6px 11px; font-size: 13px; border-radius: 8px; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
.chip {
  display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px;
  font-size: 12px; font-weight: 600; background: var(--surface-sunk); color: var(--text-2); white-space: nowrap;
}
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.ng { background: var(--ng-soft); color: var(--ng); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.acc { background: var(--accent-soft); color: var(--accent-text); }
.muted { color: var(--text-3); }
.small { font-size: 13px; }
.note {
  font-size: 13px; color: var(--text-2); background: var(--surface-2); border: 1px dashed var(--border-strong);
  border-radius: var(--radius-sm); padding: 10px 14px;
}
.bar { height: 8px; background: var(--surface-sunk); border-radius: 999px; overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: inherit; background: var(--accent); }
table.kv { width: 100%; border-collapse: collapse; font-size: 14px; }
table.kv th, table.kv td { text-align: left; padding: 9px 0; border-bottom: 1px solid var(--border); vertical-align: top; }
table.kv th { width: 34%; color: var(--text-3); font-weight: 500; padding-right: 12px; }
table.kv tr:last-child th, table.kv tr:last-child td { border-bottom: 0; }

/* ============================================================
   home
   ============================================================ */
.hero { display: grid; grid-template-columns: auto 1fr; gap: 28px; align-items: center; }
@media (max-width: 720px) { .hero { grid-template-columns: 1fr; justify-items: center; text-align: center; gap: 16px; } }
.ring { width: 168px; height: 168px; position: relative; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .lbl { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring .lbl b { font-size: 38px; line-height: 1; letter-spacing: -.02em; }
.ring .lbl span { font-size: 12px; color: var(--text-3); margin-top: 4px; }
.hero h1 { font-size: clamp(22px, 3.4vw, 32px); line-height: 1.3; margin: 0 0 8px; }
.hero p { margin: 0 0 14px; color: var(--text-2); }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 4px; }
@media (max-width: 720px) { .stats { grid-template-columns: repeat(2, 1fr); width: 100%; } }
.stat { background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; text-align: left; }
.stat span { display: block; font-size: 11.5px; color: var(--text-3); }
.stat b { font-size: 20px; letter-spacing: -.01em; }
.stat b small { font-size: 12px; font-weight: 500; color: var(--text-3); margin-left: 2px; }

.phase { display: grid; grid-template-columns: 180px 1fr; gap: 16px; padding: 18px 0; border-top: 1px solid var(--border); }
.phase:first-child { border-top: 0; padding-top: 4px; }
@media (max-width: 820px) { .phase { grid-template-columns: 1fr; gap: 10px; } }
.phase-n { font-size: 12px; font-weight: 700; color: var(--accent-text); letter-spacing: .06em; }
.phase h3 { margin: 2px 0 4px; font-size: 16px; }
.phase p { margin: 0; font-size: 12.5px; color: var(--text-3); line-height: 1.6; }
.certs { display: grid; grid-template-columns: repeat(auto-fill, minmax(236px, 1fr)); gap: 10px; }
.cc {
  position: relative; display: flex; flex-direction: column; gap: 8px; text-decoration: none; color: var(--text);
  background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px 14px 12px 18px;
  box-shadow: var(--shadow-sm); transition: box-shadow .15s, transform .15s, border-color .15s; overflow: hidden;
}
.cc::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--c); }
.cc:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); border-color: var(--border-strong); }
.cc-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.cc-abbr { font-size: 12px; font-weight: 700; letter-spacing: .04em; color: var(--text-3); }
.cc-name { font-weight: 600; font-size: 14.5px; line-height: 1.4; }
.cc-meta { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--text-3); gap: 8px; }
.cc.passed { background: linear-gradient(0deg, var(--ok-soft), var(--surface) 70%); }
.today { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
@media (max-width: 820px) { .today { grid-template-columns: 1fr; } }
.today .card { display: flex; flex-direction: column; gap: 6px; }
.today h3 { margin: 0; font-size: 14px; color: var(--text-2); font-weight: 600; }
.today .big { font-size: 26px; font-weight: 700; letter-spacing: -.01em; }
.today .card .btn { align-self: flex-start; margin-top: auto; }

/* ============================================================
   cert detail
   ============================================================ */
.detail { display: grid; grid-template-columns: 1fr 340px; gap: 16px; align-items: start; }
@media (max-width: 900px) { .detail { grid-template-columns: 1fr; } }
.cert-head { display: flex; gap: 14px; align-items: flex-start; }
.badge {
  width: 54px; height: 54px; border-radius: 14px; flex-shrink: 0; display: grid; place-items: center;
  background: var(--c); color: #fff; font-weight: 700; font-size: 13px; letter-spacing: .02em;
}
.dom { padding: 16px 0; border-top: 1px solid var(--border); }
.dom:first-child { border-top: 0; padding-top: 0; }
.dom-h { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.dom-h b { font-size: 14.5px; }
.dom-h .w { font-weight: 700; font-size: 14px; white-space: nowrap; }
.dom .en { font-size: 12px; color: var(--text-3); margin: 1px 0 8px; }
.dom ul { margin: 8px 0 0; padding-left: 1.15em; font-size: 13.5px; color: var(--text-2); }
.dom li { margin: 2px 0; }
.dom .acc-row { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--text-3); margin-top: 8px; }
.dom .acc-row .bar { flex: 1; max-width: 220px; height: 6px; }
.side { display: grid; gap: 14px; position: sticky; top: 84px; }
@media (max-width: 900px) { .side { position: static; } }
.field { display: grid; gap: 4px; margin-bottom: 10px; }
.field label { font-size: 12.5px; color: var(--text-3); font-weight: 500; }
.field select, .field input {
  width: 100%; padding: 8px 10px; border-radius: 9px; border: 1px solid var(--border-strong); background: var(--surface-2);
}

/* ============================================================
   quiz
   ============================================================ */
.quiz { max-width: 820px; margin: 0 auto; }
.qbar { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.qbar .bar { flex: 1; min-width: 120px; }
.timer { font-weight: 700; font-size: 15px; padding: 4px 10px; border-radius: 8px; background: var(--surface-sunk); }
.timer.low { background: var(--ng-soft); color: var(--ng); }
@media (max-width: 560px) { .qbar .bar { order: 5; flex-basis: 100%; } .qbar b { flex: 1; } }
.explain code, .review-item code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .9em; background: var(--surface-sunk); padding: 1px 5px; border-radius: 5px; }
.qtext { font-size: 16.5px; line-height: 1.8; margin: 6px 0 16px; font-weight: 500; }
.qdom { font-size: 12px; color: var(--text-3); }
.opts { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.opt {
  display: flex; gap: 12px; align-items: flex-start; width: 100%; text-align: left;
  padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--border); background: var(--surface);
  transition: border-color .12s, background .12s; line-height: 1.6;
}
.opt:hover { border-color: var(--border-strong); background: var(--surface-2); }
.opt .k {
  width: 26px; height: 26px; border-radius: 8px; flex-shrink: 0; display: grid; place-items: center;
  background: var(--surface-sunk); font-size: 12.5px; font-weight: 700; color: var(--text-2);
}
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.sel .k { background: var(--accent); color: #fff; }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.right .k { background: var(--ok); color: #fff; }
.opt.wrong { border-color: var(--ng); background: var(--ng-soft); }
.opt.wrong .k { background: var(--ng); color: #fff; }
.opt[disabled] { cursor: default; }
.explain { margin-top: 16px; padding: 14px 16px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--border); font-size: 14px; }
.explain b.v-ok { color: var(--ok); }
.explain b.v-ng { color: var(--ng); }
.qfoot { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
.kbd { font-size: 11.5px; color: var(--text-3); }
.navgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(34px, 1fr)); gap: 6px; margin-top: 12px; }
.navgrid button {
  height: 34px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); font-size: 12.5px; font-weight: 600;
}
.navgrid button.done { background: var(--accent-soft); border-color: transparent; color: var(--accent-text); }
.navgrid button.flag { box-shadow: inset 0 -3px 0 var(--warn); }
.navgrid button.cur { outline: 2px solid var(--accent); }
.result-score { font-size: 48px; font-weight: 700; letter-spacing: -.03em; line-height: 1; }
.review-item { padding: 14px 0; border-top: 1px solid var(--border); font-size: 14px; }
.review-item:first-child { border-top: 0; }

/* ============================================================
   learn
   ============================================================ */
.seg { display: inline-flex; gap: 4px; padding: 4px; background: var(--surface-sunk); border-radius: 12px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 6px 14px; border-radius: 9px; font-size: 13.5px; font-weight: 600; color: var(--text-2); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }
.seg button small { font-weight: 500; color: var(--text-3); margin-left: 4px; }
.filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 14px 0 6px; }
.filters select, .filters input[type="search"] {
  padding: 8px 10px; border-radius: 9px; border: 1px solid var(--border-strong); background: var(--surface); min-width: 0;
}
.filters input[type="search"] { flex: 1; min-width: 180px; }
.filters label.chk { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--text-2); }
.notes { display: grid; gap: 12px; margin-top: 12px; }
.note-card { padding: 18px 20px; }
@media (max-width: 560px) { .note-card { padding: 16px; } }
.note-card.known { border-color: color-mix(in srgb, var(--ok) 45%, var(--border)); }
.note-head { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 6px; }
.note-card h3 { margin: 2px 0 4px; font-size: 16px; line-height: 1.5; }
.note-card .sum { margin: 0 0 8px; color: var(--text-2); font-size: 14px; }
.note-card ul { margin: 6px 0; padding-left: 1.15em; font-size: 14px; }
.note-card li { margin: 3px 0; }
.note-card .tbl { margin: 8px 0; font-size: 13px; }
.note-card .tbl td:first-child { font-weight: 600; white-space: nowrap; }
@media (max-width: 560px) { .note-card .tbl td:first-child { white-space: normal; } }
.pairs { display: grid; gap: 6px; margin: 8px 0; }
.pair { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; font-size: 13.5px;
  padding: 8px 12px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--border); }
.pair .arrow { color: var(--text-3); }
.pair b { color: var(--accent-text); }
@media (max-width: 560px) { .pair { grid-template-columns: 1fr; gap: 2px; } .pair .arrow { display: none; } }
.tipbox { margin: 10px 0 0; padding: 10px 12px; border-radius: 10px; background: var(--accent-soft); color: var(--accent-text); font-size: 13.5px; }
.note-foot { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
.flash { max-width: 640px; margin: 0 auto; }
.flash-card { min-height: 240px; display: grid; place-content: center; text-align: center; padding: 28px 24px; gap: 14px; }
.flash-card .cue { font-size: 19px; font-weight: 600; line-height: 1.6; }
.flash-card .ans { font-size: 18px; color: var(--accent-text); font-weight: 700; }
.flash-card .src { font-size: 12px; color: var(--text-3); }

/* ============================================================
   plan / updates
   ============================================================ */
.gantt { display: grid; gap: 8px; }
.g-row { display: grid; grid-template-columns: 90px 1fr 120px; gap: 10px; align-items: center; font-size: 13px; }
@media (max-width: 560px) { .g-row { grid-template-columns: 64px 1fr; } .g-row .g-date { grid-column: 2; } }
.g-track { position: relative; height: 22px; background: var(--surface-sunk); border-radius: 6px; }
.g-seg { position: absolute; top: 0; bottom: 0; border-radius: 6px; background: var(--c); opacity: .9; }
.g-date { color: var(--text-3); font-size: 12px; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.tbl th, .tbl td { padding: 9px 10px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
.tbl th { font-size: 12px; color: var(--text-3); font-weight: 600; background: var(--surface-2); }
.scroll-x { overflow-x: auto; }
.upd { display: grid; gap: 12px; }
.upd .card h3 { margin: 0 0 6px; font-size: 15px; }
.upd .card p { margin: 0 0 8px; color: var(--text-2); font-size: 14px; }
.foot { margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--border); font-size: 12.5px; color: var(--text-3); }
.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); opacity: 0;
  background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 13.5px;
  transition: opacity .2s, transform .2s; pointer-events: none; z-index: 50; max-width: calc(100% - 32px);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
