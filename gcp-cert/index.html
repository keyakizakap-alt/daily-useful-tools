<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="robots" content="noindex">
<title>くもみちは移転しました</title>
<meta name="description" content="Google Cloud 認定 全冠ナビ「くもみち」は shikaku-apps に移転しました。">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --font: "Inter", "Zen Kaku Gothic New", -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif;
  --bg: #f4f6fa; --surface: #ffffff; --border: #dfe4ec;
  --text: #151c28; --text-2: #4a5568; --text-3: #7c8798;
  --accent: #6a5cf0; --accent-ink: #ffffff;
  --shadow: 0 1px 2px rgba(20,32,52,.06), 0 4px 14px rgba(20,32,52,.06);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0c1018; --surface: #141b26; --border: #252f3e;
    --text: #e8edf5; --text-2: #aab6c8; --text-3: #7a8798;
    --accent: #8b80ff; --accent-ink: #0c1018;
    --shadow: 0 1px 2px rgba(0,0,0,.4);
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; font-family: var(--font); color: var(--text); background: var(--bg);
  line-height: 1.7; font-feature-settings: "palt" 1;
}
.wrap { max-width: 640px; margin: 0 auto; padding: 56px 20px 64px; }
@media (max-width: 560px) { .wrap { padding: 36px 16px 48px; } }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); margin-bottom: 8px; }
h1 { margin: 0 0 8px; font-size: clamp(24px, 4vw, 30px); line-height: 1.35; }
.lead { margin: 0; color: var(--text-2); }
.card {
  margin-top: 28px; padding: 22px 22px 20px; border-radius: 16px; background: var(--surface);
  border: 1px solid var(--border); border-left: 5px solid var(--accent); box-shadow: var(--shadow);
}
.card h2 { margin: 0 0 6px; font-size: 16px; }
.card p { margin: 0 0 14px; font-size: 14px; color: var(--text-2); }
.card p:last-child { margin-bottom: 0; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 18px;
  border-radius: 10px; font: inherit; font-size: 15px; font-weight: 600; text-decoration: none; cursor: pointer;
  border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink);
}
.btn.secondary { background: transparent; color: var(--accent); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.url { display: block; margin-top: 12px; font-size: 12.5px; color: var(--text-3); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-all; }
#backup[hidden] { display: none; }
#saved { font-size: 13px; color: var(--text-3); }
</style>
</head>
<body>
<main class="wrap">
  <div class="eyebrow">Google Cloud 認定 全冠ナビ（非公式）</div>
  <h1>くもみちは移転しました</h1>
  <p class="lead">くもみちは、資格対策アプリ集 <strong>shikaku-apps</strong> に引っ越しました。機能はこれまでと同じです。</p>

  <section class="card" id="backup" hidden>
    <h2>このブラウザに学習の記録が残っています</h2>
    <p>新しいくもみちはアドレスが違うため、記録は自動では引き継がれません。先にこのボタンで書き出し、新しいくもみちの「設定 → JSON を読み込む」で取り込んでください。</p>
    <div class="actions"><button type="button" class="btn secondary" id="export">学習の記録を書き出す（JSON）</button></div>
    <p id="saved" role="status"></p>
  </section>

  <section class="card">
    <h2>新しいくもみち</h2>
    <p>ブックマークを新しいアドレスに変更してください。</p>
    <div class="actions"><a class="btn" id="go" href="https://shikaku-apps.vercel.app/gcp-cert/">新しいくもみちを開く</a></div>
    <span class="url">https://shikaku-apps.vercel.app/gcp-cert/</span>
  </section>

</main>
<script src="moved.js"></script>
</body>
</html>
