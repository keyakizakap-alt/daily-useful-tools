<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>スマート割り勘 | Smart Warikan</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <h1>スマート割り勘</h1>
    <p class="subtitle">支払いを記録するだけで、送金回数が最も少なくなる精算プランを自動計算します。</p>
  </header>

  <main>
    <section class="card" aria-labelledby="members-heading">
      <h2 id="members-heading">1. 参加者を登録</h2>
      <form id="member-form" class="inline-form">
        <label for="member-name" class="visually-hidden">参加者名</label>
        <input id="member-name" name="member-name" type="text" placeholder="例: あかり" autocomplete="off" required />
        <button type="submit">追加</button>
      </form>
      <ul id="member-list" class="chip-list" aria-live="polite"></ul>
      <p id="member-hint" class="hint">まずは2人以上の参加者を登録してください。</p>
    </section>

    <section class="card" aria-labelledby="expenses-heading">
      <h2 id="expenses-heading">2. 支出を登録</h2>
      <form id="expense-form" class="expense-form">
        <div class="form-row">
          <label for="expense-title">品目名（任意）</label>
          <input id="expense-title" name="expense-title" type="text" placeholder="例: 居酒屋の会計" autocomplete="off" />
        </div>
        <div class="form-row">
          <label for="expense-amount">金額（円）</label>
          <input id="expense-amount" name="expense-amount" type="number" min="1" step="1" required />
        </div>
        <div class="form-row">
          <label for="expense-payer">支払者</label>
          <select id="expense-payer" name="expense-payer" required></select>
        </div>
        <fieldset class="form-row">
          <legend>割り勘対象者と負担割合</legend>
          <div id="expense-shares" class="shares-grid"></div>
          <p class="hint">負担割合を「2」にすると、その人は2人分として負担します（既定値は1）。チェックを外すとその人はこの支出を負担しません。</p>
        </fieldset>
        <button type="submit">支出を追加</button>
      </form>

      <table id="expense-table" class="data-table" hidden>
        <thead>
          <tr>
            <th>品目</th>
            <th>金額</th>
            <th>支払者</th>
            <th>対象者</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="expense-table-body"></tbody>
      </table>
      <p id="expense-empty" class="hint">まだ支出が登録されていません。</p>
    </section>

    <section class="card" aria-labelledby="settlement-heading">
      <h2 id="settlement-heading">3. 精算結果</h2>
      <button id="settle-button" type="button">精算する</button>
      <div id="settlement-result" aria-live="polite"></div>
      <button id="copy-button" type="button" hidden>結果をコピー</button>
      <p id="copy-status" role="status" class="hint"></p>
    </section>
  </main>

  <footer class="app-footer">
    <p>データはこのブラウザ内のみで処理され、外部には送信されません。</p>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
