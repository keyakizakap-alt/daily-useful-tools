# 判定基準表 — 仕様書のどこを「矛盾」「実現不能」とみなすかの定義。
# ここは業務側が編集する前提のファイル。AI はこの表に無い理由で指摘してはならない。

[meta]
name = "既定の判定基準表 v1"
version = "2026-09-12"
note = "組織のルールに合わせて rule を足し引きしてください。id は変更しないこと。"

[[rule]]
id = "R-001"
category = "矛盾"
title = "期限の前後関係が破綻している"
description = "あるタスクが別のタスクの完了を前提にしているのに、前提側の期限が後になっている場合。"
severity = "高"
check_hint = "depends_on と due を突き合わせる。どちらかが未確認なら指摘ではなく質問に回す。"

[[rule]]
id = "R-002"
category = "矛盾"
title = "同一対象に相反する記述がある"
description = "同じ機能・数値・対象について、両立しない記述が2箇所以上ある場合（例: 保持期間 30日 と 1年）。"
severity = "高"
check_hint = "数値・期間・可否の記述を対象ごとに集めて突き合わせる。"

[[rule]]
id = "R-003"
category = "実現不能"
title = "前提となる入力・データが存在しない"
description = "処理が必要とする入力やデータの出所が仕様書のどこにも書かれていない場合。"
severity = "高"
check_hint = "出力に使われている項目が、どこかで取得・生成されているかを辿る。"

[[rule]]
id = "R-004"
category = "実現不能"
title = "期限に対して作業量が明らかに過大"
description = "同一担当者に、同一期限で、明らかに並行不能な量のタスクが割り当てられている場合。"
severity = "中"
check_hint = "担当者×期限で件数を数える。担当が未確認のものは数えない。"

[[rule]]
id = "R-005"
category = "情報不足"
title = "担当者が特定できない"
description = "実行を要するタスクなのに担当者・担当部署の記載がない場合。"
severity = "中"
check_hint = "推測で埋めず未確認のままにし、質問作成へ回す。"

[[rule]]
id = "R-006"
category = "情報不足"
title = "期限が特定できない"
description = "実行を要するタスクなのに期限や時期の記載がない場合。「なるべく早く」等も特定できないものとして扱う。"
severity = "中"
check_hint = "相対表現（今月中・追って連絡）は基準日が書かれていなければ未確認とする。"

[[rule]]
id = "R-007"
category = "情報不足"
title = "完了条件が定義されていない"
description = "何をもって完了とするかが書かれておらず、後から解釈が割れる可能性がある場合。"
severity = "低"
check_hint = "検収・受入条件・成果物の形式の記載を探す。"

[[rule]]
id = "R-008"
category = "責任不明確"
title = "決定者と実行者が区別できない"
description = "承認・決裁が必要そうな事項について、誰が決めるのかが書かれていない場合。"
severity = "中"
check_hint = "「合意する」「決定する」を含む記述に決定主体があるかを見る。"

[[rule]]
id = "R-009"
category = "法令・セキュリティ"
title = "個人情報・機密の取り扱いが未定義"
description = "個人情報や機密データを扱う記述があるのに、保管先・保持期間・アクセス範囲が書かれていない場合。"
severity = "高"
check_hint = "氏名・連絡先・契約情報・認証情報に触れる記述を拾う。"

[[rule]]
id = "R-010"
category = "法令・セキュリティ"
title = "外部送信の可否が未定義"
description = "外部サービスやSaaSへデータを渡す記述があるのに、送信してよいデータ範囲が書かれていない場合。"
severity = "高"
check_hint = "連携・API・アップロード・共有という語の周辺を見る。"
