<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>のし袋アシスタント</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app">
  <header class="app-header">
    <h1>のし袋アシスタント</h1>
    <p class="subtitle">表書き・水引・相場・金額の書き方を、選ぶだけで確認できます</p>
  </header>

  <main>
    <section class="step">
      <label for="occasion-select">1. 行事を選ぶ</label>
      <select id="occasion-select"></select>
    </section>

    <section class="step" id="relation-step">
      <label for="relation-select" id="relation-label">2. 関係性を選ぶ</label>
      <select id="relation-select"></select>
    </section>

    <section class="step">
      <label for="amount-input">3. 金額を入力（任意）</label>
      <input type="number" id="amount-input" min="0" max="99999999" step="1000" placeholder="例: 30000" />
    </section>

    <section class="result-card" id="result-card" aria-live="polite">
      <p class="placeholder">行事を選ぶと結果が表示されます。</p>
    </section>
  </main>

  <footer class="app-footer">
    <p>※ 表書き・水引・金額相場は一般的な目安です。地域やご家庭、宗派によって慣習が異なる場合がありますので、迷う場合は年長者や地域の慣習に詳しい方にご確認ください。</p>
  </footer>
</div>

<script src="data/occasions.data.js"></script>
<script src="logic.js"></script>
<script src="app.js"></script>
</body>
</html>
