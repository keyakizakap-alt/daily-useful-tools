<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>表記ゆれ統一チェッカー</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="page-header">
      <h1>表記ゆれ統一チェッカー</h1>
      <p class="lead">
        日本語の文章を貼り付けると、全角/半角の混在や「サーバ/サーバー」のような
        長音符号の有無による表記ゆれを検出し、ワンクリックで統一できます。
      </p>
      <p class="privacy-note">
        🔒 入力したテキストは外部に送信されず、すべてこのブラウザの中だけで処理されます。
      </p>
    </header>

    <main>
      <section class="input-section">
        <label for="input-text">チェックしたい文章</label>
        <textarea
          id="input-text"
          rows="10"
          placeholder="ここに文章を貼り付けてください。例: サーバの負荷が高いのでサーバーを増設した。Ａ社と提携しA社の株価は１２３円になった。"
        ></textarea>
        <div class="actions">
          <button id="check-button" type="button">チェックする</button>
          <button id="unify-all-button" type="button" disabled>すべて一括で統一する</button>
          <button id="copy-button" type="button" disabled>結果をコピー</button>
        </div>
        <p id="copy-status" class="status" role="status" aria-live="polite"></p>
      </section>

      <section class="results-section">
        <h2>検出結果</h2>
        <div id="findings-list" aria-live="polite"></div>
      </section>

      <section class="preview-section">
        <h2>プレビュー(検出箇所ハイライト)</h2>
        <div id="preview" class="preview"></div>
      </section>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
